name: Deploy GLOW Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "solar_final/**"
      - "tables/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lightweight site source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            .
            .github
            assets

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 35
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          PAGES_DEPLOY_TIMEOUT_MS: "1800000"
        with:
          github-token: ${{ github.token }}
          retries: 3
          script: |
            const deployPages = require('./.github/scripts/deploy-pages.js');
            await deployPages({ github, context, core });
