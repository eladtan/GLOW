name: Deploy GLOW Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "solar_final/**"
      - "tables/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lightweight site source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            .
            assets

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site

      - name: Verify lightweight site output
        shell: bash
        run: |
          test -f ./_site/index.html
          test -f ./_site/tables.json
          test ! -e ./_site/tables
          test ! -e ./_site/solar_final

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
